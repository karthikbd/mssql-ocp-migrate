[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-ocp-migrate"
version = "0.5.0"
description = "Migrate SQL Server databases to SQL Server on OpenShift (or anywhere) with parallel chunked copy, resume and end-to-end validation. Zero dependencies: the TDS driver is bundled."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/mssql_ocp_migrate/_vendor/LICENSE-python-tds.txt"]
authors = [{ name = "Karthikeyan Balasundaram" }]
keywords = ["sql server", "mssql", "migration", "openshift", "ocp", "data validation", "tds", "bulk copy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
# Deliberately empty: nothing is downloaded at install time. pyodbc is used only if already installed.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=2", "sphinx-copybutton", "sphinx-design"]

[project.urls]
Homepage = "https://github.com/karthikbd/mssql-ocp-migrate"
Documentation = "https://mssql-ocp-migrate.readthedocs.io"
Source = "https://github.com/karthikbd/mssql-ocp-migrate"
Issues = "https://github.com/karthikbd/mssql-ocp-migrate/issues"
Changelog = "https://github.com/karthikbd/mssql-ocp-migrate/blob/main/CHANGELOG.md"

[project.scripts]
mssql-migrate = "mssql_ocp_migrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mssql_ocp_migrate = ["_vendor/LICENSE-python-tds.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:mssql_ocp_migrate._vendor"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
extend-exclude = ["src/mssql_ocp_migrate/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "S", "C4", "PIE", "RUF"]
ignore = ["B008", "B023", "B027", "B905", "E501", "E731", "SIM105", "SIM115", "RUF001", "RUF002", "RUF003", "C408"]

[tool.ruff.lint.per-file-ignores]
# T-SQL is built from bracket-quoted identifiers (ddl.q), escaped literals (ddl.lit) and catalog
# metadata; values from user data are always bound parameters (S608 can't see that)
"src/mssql_ocp_migrate/*.py" = ["S608"]
# *_password_env / *_secret_key_env name an environment variable, not a secret
"src/mssql_ocp_migrate/config.py" = ["S608", "S105"]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S310", "S311", "S603", "S607", "S608", "RUF005", "RUF012", "RUF015", "RUF059"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["src/mssql_ocp_migrate/_vendor/"]

[[tool.mypy.overrides]]
module = "mssql_ocp_migrate._vendor.*"
ignore_errors = true      # vendored python-tds, kept as upstream wrote it

[[tool.mypy.overrides]]
module = "mssql_ocp_migrate.sqlserver"
disallow_untyped_calls = false   # calls into the vendored driver, whose functions carry no annotations

[tool.coverage.run]
source = ["mssql_ocp_migrate"]
omit = ["*/_vendor/*"]
branch = true
concurrency = ["thread", "multiprocessing"]   # the copy runs in a process pool
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = false
skip_covered = true
