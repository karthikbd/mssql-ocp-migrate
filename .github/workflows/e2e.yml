name: End-to-end (SQL Server)

# Runs the e2e suite against two real SQL Server containers (source and target) for each version pair, the same
# setup as tests/e2e/docker-compose.yml: a full logical migration with validation, then lift. Each pair runs with
# every driver: the bundled pytds, pyodbc + Microsoft ODBC Driver 18, and pymssql.
on:
  push:
    branches: ["main", "release/**"]
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true


jobs:
  e2e:
    name: e2e ${{ matrix.pair.name }} (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pair:
          - {name: "2022 -> 2022", source: "2022-latest", target: "2022-latest"}
          - {name: "2019 -> 2022", source: "2019-latest", target: "2022-latest"}
          - {name: "2022 -> 2025", source: "2022-latest", target: "2025-latest"}
          - {name: "2025 -> 2025", source: "2025-latest", target: "2025-latest"}
        driver: ["pytds", "pyodbc", "pymssql"]
    env:
      SOURCE_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.pair.source }}
      TARGET_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.pair.target }}
      E2E_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test tooling (hash-locked) and the package (no dependencies)
        run: |
          pip install --require-hashes -r ci/requirements-test.txt
          pip install --no-deps -e .
      - name: Install pyodbc and Microsoft ODBC Driver 18
        if: matrix.driver == 'pyodbc'
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d
          pip install --require-hashes --no-deps -r ci/requirements-e2e.txt
      - name: Install pymssql
        if: matrix.driver == 'pymssql'
        run: pip install --require-hashes --no-deps -r ci/requirements-e2e.txt
      - name: Start source and target SQL Server
        run: docker compose -f tests/e2e/docker-compose.yml up -d
      - name: Wait until both servers accept connections
        run: |
          for svc in source target; do
            for i in $(seq 1 90); do
              if docker compose -f tests/e2e/docker-compose.yml logs "$svc" 2>&1 \
                   | grep -q "SQL Server is now ready for client connections"; then
                echo "$svc ready"; break
              fi
              sleep 2
            done
          done
          sleep 10
      - name: Run the end-to-end suite
        env:
          MSSQL_E2E: "1"
        run: python -m pytest tests/e2e/test_e2e_sqlserver.py tests/e2e/test_e2e_lift.py -v --tb=short -s -o faulthandler_timeout=900
      - name: Keep the migration report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.driver }}-${{ strategy.job-index }}
          path: /tmp/pytest-of-runner/**/report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Server logs and blocking sessions on failure
        if: failure() || cancelled()
        run: |
          docker compose -f tests/e2e/docker-compose.yml logs --tail 200
          for svc in source target; do
            docker compose -f tests/e2e/docker-compose.yml exec -T "$svc" /opt/mssql-tools18/bin/sqlcmd -C \
              -S localhost -U sa -P 'Str0ng!Passw0rd' -W -Q "SELECT r.session_id, r.blocking_session_id,
              r.wait_type, r.wait_time, r.command, DB_NAME(r.database_id), LEFT(t.text, 300) FROM sys.dm_exec_requests r
              CROSS APPLY sys.dm_exec_sql_text(r.sql_handle) t WHERE r.session_id <> @@SPID" || true
          done
