name: Publish mssql-ocp-migrate to PyPI

# Publish by creating a GitHub release (vX.Y.Z). One trigger only, so a release never uploads twice.
on:
  release:
    types: [published]
  workflow_dispatch:

# Minimal default — jobs opt in to only what they need.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          pip install --upgrade build
          python -m build
      - name: Check the wheel declares no runtime dependencies
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = next(n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA"))
          reqs = [l for l in zipfile.ZipFile(whl).read(meta).decode().splitlines()
                  if l.startswith("Requires-Dist") and "extra ==" not in l]
          assert not reqs, reqs
          print("no runtime dependencies:", whl)
          PY
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # No PYPI_API_TOKEN needed — uses OIDC Trusted Publishing.
        # Configure at: https://pypi.org/manage/account/publishing/
        # (pending publisher: mssql-ocp-migrate / karthikbd / mssql-ocp-migrate / python-publish.yml / release)
