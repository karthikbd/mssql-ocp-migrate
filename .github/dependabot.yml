version: 2
updates:
  # Keep GitHub Actions up to date (grouped, so paired actions such as codeql init/analyze move together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Hash-locked CI tooling under ci/ (the package itself has no runtime dependencies)
  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
    groups:
      ci-tooling:
        patterns: ["*"]

  # ClusterFuzzLite base image (pinned by digest)
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
